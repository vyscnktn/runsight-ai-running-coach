name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install numpy pandas matplotlib
      - name: Scenario tests (labelling pipeline, QC rules, workflow sanitiser)
        run: python -m unittest discover -s tests -v
      - name: Workflow JSON is valid and contains no obvious secrets
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import sanitize_workflow as sw
          text = open("n8n/runsight_workflow.json", encoding="utf-8").read()
          json.loads(text)
          left = sw.leftovers(text)
          assert not left, left
          PY
      - name: Notebooks are valid JSON without outputs
        run: |
          python - <<'PY'
          import glob, json
          for f in glob.glob("training/*.ipynb"):
              nb = json.load(open(f, encoding="utf-8"))
              assert all(not c.get("outputs") for c in nb["cells"] if c["cell_type"] == "code"), f
          PY
